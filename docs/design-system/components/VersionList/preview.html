<!-- @dsCard group="Desenho" height=170 -->
<style>
.wrap { margin: var(--space-4); font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--color-neutral-900); border: 1px solid var(--color-neutral-300); border-radius: var(--radius-md); overflow: hidden; }
.linha { display: grid; grid-template-columns: 80px 1fr 110px 90px; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-neutral-300); }
.cabecalho { background: var(--color-neutral-100); font-size: 12px; font-weight: 500; color: var(--color-neutral-700); }
.mono { font-family: var(--font-mono); font-size: 12px; }
.atual { font-size: 12px; font-weight: 500; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); background: var(--color-brand-100); color: var(--color-brand-900); justify-self: start; }
.acao { font: inherit; font-size: 14px; font-weight: 500; color: var(--color-brand-700); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.acao:focus-visible { outline: 2px solid var(--color-brand-500); outline-offset: 2px; }
</style>
<div class="wrap">
  <div class="linha cabecalho"><span>Versão</span><span>Gerada em</span><span>Status</span><span>Ação</span></div>
  <div class="linha"><span class="mono">v3</span><span class="mono">21/10/2026 14:35</span><span class="atual">Atual</span><button class="acao">Visualizar</button></div>
  <div class="linha"><span class="mono">v2</span><span class="mono">20/10/2026 09:12</span><span>Gerado</span><button class="acao">Visualizar</button></div>
</div>
