<!-- @dsCard group="Formulários" height=150 -->
<style>
.stack { display: grid; gap: var(--space-4); padding: var(--space-4); font-family: var(--font-sans); max-width: 320px; }
.campo { font-size: 14px; line-height: 20px; color: var(--color-neutral-900); }
.entrada { display: flex; align-items: center; height: 40px; border: 1px solid var(--color-neutral-500); border-radius: var(--radius-sm); background: var(--color-neutral-0); padding: 0 var(--space-3); }
.entrada input { border: 0; outline: 0; flex: 1; font: inherit; font-family: var(--font-mono); font-size: 14px; color: var(--color-neutral-900); background: transparent; min-width: 0; }
.unidade { font-family: var(--font-mono); font-size: 12px; color: var(--color-neutral-700); }
.erro { border-color: var(--color-error-700); box-shadow: inset 0 0 0 1px var(--color-error-700); }
.msg { font-size: 12px; line-height: 16px; color: var(--color-error-700); }
</style>
<div class="stack">
  <div>
    <div class="campo">Potência</div>
    <div class="entrada"><input value="500" inputmode="numeric" aria-label="Potência"><span class="unidade">kVA</span></div>
  </div>
  <div>
    <div class="campo">Potência</div>
    <div class="entrada erro"><input value="0" inputmode="numeric" aria-label="Potência com erro" aria-invalid="true"><span class="unidade">kVA</span></div>
    <div class="msg">A potência deve ser maior que zero.</div>
  </div>
</div>
