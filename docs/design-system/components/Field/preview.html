<!-- @dsCard group="Formulários" height=150 -->
<style>
.stack { display: grid; gap: var(--space-4); padding: var(--space-4); font-family: var(--font-sans); max-width: 320px; }
.rotulo { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--color-neutral-900); margin-bottom: var(--space-2); }
.ajuda { font-size: 12px; line-height: 16px; color: var(--color-neutral-700); margin-top: var(--space-1); }
.erro { font-size: 12px; line-height: 16px; color: var(--color-error-700); margin-top: var(--space-1); }
.controle { height: 40px; width: 100%; box-sizing: border-box; border: 1px solid var(--color-neutral-500); border-radius: var(--radius-sm); padding: 0 var(--space-3); font: inherit; font-size: 14px; background: var(--color-neutral-0); color: var(--color-neutral-900); }
</style>
<div class="stack">
  <div>
    <div class="rotulo">Frequência</div>
    <select class="controle" aria-describedby="ajuda-freq"><option>60 Hz</option><option>50 Hz</option></select>
    <div class="ajuda" id="ajuda-freq">Frequência da rede de alimentação.</div>
  </div>
  <div>
    <div class="rotulo">Fases</div>
    <input class="controle" value="2" aria-invalid="true" aria-describedby="erro-fases">
    <div class="erro" id="erro-fases">Selecione 1 ou 3 fases.</div>
  </div>
</div>
