<style>
.stack { display: grid; gap: var(--space-3); padding: var(--space-4); font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--color-neutral-900); }
.linha { display: flex; justify-content: space-between; align-items: center; max-width: 280px; }
.trilho { width: 40px; height: 22px; border-radius: 11px; position: relative; background: var(--color-neutral-500); }
.trilho::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-neutral-0); }
.ligado { background: var(--color-brand-700); }
.ligado::after { left: 21px; }
.estado { font-size: 12px; color: var(--color-neutral-700); margin-right: var(--space-2); }
</style>
<div class="stack">
  <div class="linha"><span>Possui tanque</span><span><span class="estado">Ativado</span><span class="trilho ligado" role="switch" aria-checked="true" aria-label="Possui tanque"></span></span></div>
  <div class="linha"><span>Possui conservador</span><span><span class="estado">Desativado</span><span class="trilho" role="switch" aria-checked="false" aria-label="Possui conservador"></span></span></div>
</div>
